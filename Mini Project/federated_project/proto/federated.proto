syntax = "proto3";

package federated;

service FederatedService {

  rpc RegisterClient (RegisterRequest) returns (RegisterResponse);

  rpc SendLoRA (EncryptedLoRARequest) returns (LoRAResponse);

  rpc GetGlobal (GlobalRequest) returns (EncryptedGlobalResponse);

  // ===============================
  // NEW HEARTBEAT RPC
  // ===============================
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

message RegisterRequest {
  string client_name = 1;
  bytes client_public_key = 2;
}

message RegisterResponse {
  string message = 1;
  bytes server_public_key = 2;
}

message EncryptedLoRARequest {
  string client_name = 1;
  bytes encrypted_key = 2;
  bytes iv_weights = 3;
  bytes iv_config = 4;
  bytes encrypted_weights = 5;
  bytes encrypted_config = 6;
}

message LoRAResponse {
  string message = 1;
}

message GlobalRequest {
  string client_name = 1;
}

message EncryptedGlobalResponse {
  string message = 1;
  bytes encrypted_key = 2;
  bytes iv_weights = 3;
  bytes iv_config = 4;
  bytes encrypted_weights = 5;
  bytes encrypted_config = 6;
}

// ===============================
// HEARTBEAT MESSAGES
// ===============================

message HeartbeatRequest {
  string client_name = 1;
}

message HeartbeatResponse {
  string message = 1;
}